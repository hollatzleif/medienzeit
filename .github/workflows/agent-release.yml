name: Laptop-Programm bauen

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - 'agent/**'
      - 'scripts/*.ps1'
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'scripts/*.ps1'

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Tests ausführen
        run: dotnet test agent/Medienzeit.sln -c Release

  build:
    name: Windows-Programm bauen
    needs: test
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version bestimmen
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${{ github.event.release.tag_name }}"; V="${V#v}"
          else
            V="1.0.0"
          fi
          # nur Ziffern und Punkte zulassen, sonst 1.0.0
          if ! echo "$V" | grep -Eq '^[0-9]+(\.[0-9]+){0,3}$'; then V="1.0.0"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Veröffentlichen (Einzeldatei, win-x64)
        shell: bash
        run: >
          dotnet publish agent/Medienzeit.Agent/Medienzeit.Agent.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -p:Version=${{ steps.ver.outputs.version }}
          -o out/medienzeit-laptop

      - name: Skripte dazulegen und packen
        shell: pwsh
        run: |
          Copy-Item scripts/install.ps1, scripts/uninstall.ps1, agent/README-Agent.md out/medienzeit-laptop/
          Compress-Archive -Path out/medienzeit-laptop/* -DestinationPath medienzeit-laptop.zip -Force

      - name: Als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: medienzeit-laptop
          path: medienzeit-laptop.zip

      - name: An Release anhängen
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" medienzeit-laptop.zip --clobber
