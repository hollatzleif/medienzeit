name: Deploy (Server)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'agent/**'
      - 'laptop/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typprüfung
        run: npm run typecheck
      - name: Tests der Zeitberechnung
        run: npm test

  deploy:
    name: Auf Cloudflare veröffentlichen
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Einrichtung prüfen
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::GitHub-Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID fehlen (README, Schritt 4)."
            exit 1
          fi
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.jsonc; then
            echo "::error::In wrangler.jsonc ist noch keine D1-Datenbank-ID eingetragen (README, Schritt 3)."
            exit 1
          fi

      - name: Datenbank aktualisieren (Migrationen)
        run: npx wrangler d1 migrations apply DB --remote

      - name: Worker veröffentlichen
        run: npx wrangler deploy

      - name: Geheimnisse an Cloudflare übergeben
        env:
          LUDWIG_TOKEN: ${{ secrets.LUDWIG_TOKEN }}
          PARENT_TOKEN: ${{ secrets.PARENT_TOKEN }}
          DEVICE_TOKEN: ${{ secrets.DEVICE_TOKEN }}
          PINS: ${{ secrets.PINS }}
        run: |
          node scripts/secrets-json.mjs > "$RUNNER_TEMP/secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"
